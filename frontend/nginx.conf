server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 100m;

    location = /sw.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend. Docker DNS (127.0.0.11) is used so Nginx
    # does not keep a stale IP after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $icase_backend "http://backend:8080";
        proxy_pass $icase_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Accept-Charset "utf-8";
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
