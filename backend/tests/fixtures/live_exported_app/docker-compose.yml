# Docker Compose Full-Stack para Hospital San Lucas
# Generado automáticamente por ICASE Studio
# Ejecutar: docker compose up --build -d

services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: hospital_san_lucas_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hospital_san_lucas_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hospital_san_lucas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Backend REST API (Express + Sequelize)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_san_lucas_backend
    restart: always
    command: sh -c "node src/migrate.js && node src/server.js"
    ports:
      - "${BACKEND_PORT:-8085}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hospital_san_lucas_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. Frontend Web SPA (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital_san_lucas_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
