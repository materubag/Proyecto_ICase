services:
  # ============================================================================
  # 1. Base de Datos - PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: icase_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icase_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icase_password}
      POSTGRES_DB: ${POSTGRES_DB:-icase_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icase_user} -d ${POSTGRES_DB:-icase_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - icase_network

  # ============================================================================
  # 2. Backend REST API - Node.js + Express + Prisma
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icase_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-icase_user}:${POSTGRES_PASSWORD:-icase_password}@postgres:5432/${POSTGRES_DB:-icase_db}?schema=public
      PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-16000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-384}
      GEMINI_MAX_ITEMS_PER_BATCH: ${GEMINI_MAX_ITEMS_PER_BATCH:-20}
      GEMINI_MIN_REQUEST_INTERVAL_MS: ${GEMINI_MIN_REQUEST_INTERVAL_MS:-6000}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0}
      GEMINI_TOKEN_PREFLIGHT: ${GEMINI_TOKEN_PREFLIGHT:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120000}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8001}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-es}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-10}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-100}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.85}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_MOCKUP_WEBHOOK: ${N8N_MOCKUP_WEBHOOK:-}
      N8N_TIMEOUT: ${N8N_TIMEOUT:-120000}
      MOCKUP_MAX_REQUIREMENTS: ${MOCKUP_MAX_REQUIREMENTS:-12}
      AI_ANALYSIS_STRATEGY: ${AI_ANALYSIS_STRATEGY:-rules-first}
      AI_MAX_CHUNKS: ${AI_MAX_CHUNKS:-20}
      AI_CHUNK_MAX_LENGTH: ${AI_CHUNK_MAX_LENGTH:-350}
      AI_FALLBACK_CONFIDENCE_THRESHOLD: ${AI_FALLBACK_CONFIDENCE_THRESHOLD:-0.65}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icase_network

  # ============================================================================
  # 3. Frontend SPA - React + Vite + Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: icase_frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - icase_network

  # ============================================================================
  # 4. Motor LLM Local - Ollama (Alternativo)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: icase_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - icase_network

  # ============================================================================
  # 5. Servicio de Transcripción Local - Faster-Whisper (CPU + int8)
  # ============================================================================
  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: icase_whisper
    restart: always
    expose:
      - "8001"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-es}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-100}
    volumes:
      - whisper_models:/root/.cache/huggingface
    networks:
      - icase_network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  whisper_models:
    driver: local

networks:
  icase_network:
    driver: bridge
